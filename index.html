  // Parse match time correctly for Bangladesh time (UTC+6)
  function parseMatchDateTime(dateStr, timeStr) {
    const [h, m] = timeStr.split(":").map(Number);
    const [y, mo, d] = dateStr.split("-").map(Number);
    return new Date(Date.UTC(y, mo-1, d, h-6, m));
  }

  function formatCountdown(ms) {
    if (ms <= 0) return { d:0, h:0, m:0, s:0 };
    const totalSec = Math.floor(ms / 1000);
    return { d: Math.floor(totalSec / 86400), h: Math.floor((totalSec % 86400) / 3600), m: Math.floor((totalSec % 3600) / 60), s: totalSec % 60 };
  }

  function pad(n) { return String(n).padStart(2, "0"); }
  
  function formatTime12(timeStr) {
    const [h, m] = timeStr.split(":").map(Number);
    const hour12 = h % 12 || 12;
    const ampm = h >= 12 ? "PM" : "AM";
    return { hour: hour12, minute: pad(m), ampm: ampm };
  }
  
  function formatDateHeader(dateStr) {
    const d = new Date(dateStr + "T12:00:00");
    return d.toLocaleDateString("bn-BD", { weekday:"short", month:"short", day:"numeric" }).toUpperCase();
  }

  function isMatchLive(matchDateTime) {
    const now = new Date();
    const matchEndTime = new Date(matchDateTime.getTime() + 105 * 60000);
    return (matchDateTime <= now && now <= matchEndTime);
  }

  // Modified: Keep ALL group stage matches, only remove future knockout matches after they end
  function removeOldMatches(fixtures, currentTime) {
    return fixtures.filter(fixture => {
      // Always keep group stage matches
      if (fixture.stage === "Group Stage") {
        return true;
      }
      // For knockout stages, remove after 105 minutes
      const matchDateTime = parseMatchDateTime(fixture.date, fixture.time);
      const matchEndTime = new Date(matchDateTime.getTime() + 105 * 60000);
      return matchEndTime > currentTime;
    });
  }

  // Function to open live streaming links
  function openLiveStream(url) {
    window.open(url, '_blank');
  }

  // Function to detect which stage should be active
  function getActiveStage(fixtures, currentTime) {
    const enriched = fixtures.map(f => ({ ...f, dt: parseMatchDateTime(f.date, f.time) }));
    
    // First check: Is there any live match?
    const liveMatch = enriched.filter(f => isMatchLive(f.dt)).sort((a,b) => a.dt - b.dt)[0];
    if (liveMatch) {
      return liveMatch.stage;
    }
    
    // Second check: Find the next upcoming match
    const futureMatches = enriched.filter(f => f.dt > currentTime).sort((a,b) => a.dt - b.dt);
    if (futureMatches.length > 0) {
      return futureMatches[0].stage;
    }
    
    // If no future matches, find the last stage that has matches (completed tournament)
    for (let i = stageOrder.length - 1; i >= 0; i--) {
      const stage = stageOrder[i];
      const hasMatches = enriched.some(f => f.stage === stage);
      if (hasMatches) {
        return stage;
      }
    }
    
    // Default to Group Stage
    return "Group Stage";
  }

  let currentState = { 
    now: new Date(), 
    selectedStage: "Group Stage", 
    showGroups: false 
  };
  let intervalId = null;

  function setStage(stage) { 
    currentState.selectedStage = stage; 
    renderApp(); 
  }
  
  function toggleGroups() { 
    currentState.showGroups = !currentState.showGroups; 
    renderApp(); 
  }
  
  function getNextMatch(fixturesWithDT) { 
    return fixturesWithDT.filter(f => f.dt > currentState.now).sort((a,b) => a.dt - b.dt)[0] || null; 
  }
  
  function getLiveMatch(fixturesWithDT) {
    return fixturesWithDT.filter(f => isMatchLive(f.dt)).sort((a,b) => a.dt - b.dt)[0] || null;
  }

    if (!hasMatchesInSelected) {
      const detectedStage = getActiveStage(activeFixtures, currentState.now);
      currentState.selectedStage = detectedStage;

            matchWithFlags = m.match;
          } else if (m.match && m.match.includes(" vs ")) {
            matchWithFlags = formatMatchWithBn(m.match);
          }
          
          const timeObj = formatTime12(m.time);
          
          let statusBadge = "";
          if (isThisLive) {
            statusBadge = `<span style="background: #ff0000; color: white; font-size: 8px; font-weight: bold; padding: 2px 8px; border-radius: 20px; margin-left: 8px;" class="live-pulse">🔴 লাইভ</span>`;
          }
          
          return `<div style="background: ${isThisLive ? 'rgba(255,0,0,0.15)' : (isNextFlag ? 'rgba(197,160,40,0.12)' : isPast ? 'rgba(255,255,255,0.015)' : 'rgba(255,255,255,0.04)')}; border-left: 3px solid ${isThisLive ? '#ff0000' : (isNextFlag ? '#c5a028' : '#2a4a6a')}; border-radius: 12px; padding: 12px; margin-bottom: 10px; position: relative; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            ${isNextFlag && !isThisLive ? `<div style="position: absolute; top: -9px; right: 10px; background: #c5a028; color: #041226; font-size: 8px; font-weight: bold; padding: 2px 12px; border-radius: 40px;">পরবর্তী</div>` : ''}
            <div class="time-badge"><div><span class="time-hour">${timeObj.hour}:${timeObj.minute}</span><span class="time-ampm">${timeObj.ampm}</span></div><div class="time-label">বিএসটি</div></div>
            <div style="flex: 1; min-width: 150px;"><div style="font-size: 14px; font-weight: 600; color: ${isPast ? '#809cb0' : '#fdf6e3'}; line-height: 1.4;">${matchWithFlags} ${statusBadge}</div><div style="font-size: 10px; color: #6f8faa; margin-top: 5px;">📍 ${m.venue}</div></div>
          </div>`;
        }).join('');
        return `<div style="margin-bottom: 28px;"><div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;"><div style="background: linear-gradient(135deg, #c5a028, #e6cf6e); color: #041226; font-weight: bold; font-size: 10px; padding: 4px 16px; border-radius: 40px;">${dateHeader}</div><div style="flex: 1; height: 1px; background: radial-gradient(circle, rgba(197,160,40,0.4), transparent);"></div></div>${matchesHtml}</div>`;
      }).join('');
    }
    
    let liveMatchHtml = "";
    if (liveMatch) {
      let liveMatchFormatted = liveMatch.match;
      if (liveMatch.stage === "Group Stage" && liveMatch.score1 !== undefined && liveMatch.score2 !== undefined) {
        liveMatchFormatted = formatMatchWithScore(liveMatch.match, liveMatch.score1, liveMatch.score2);
      } else if (liveMatch.match.includes(" vs ") && !liveMatch.match.includes("বনাম") && !liveMatch.match.includes("TBD") && !liveMatch.match.includes("Winner")) {
        liveMatchFormatted = formatMatchWithBn(liveMatch.match);
      }
      const liveTimeObj = formatTime12(liveMatch.time);
      liveMatchHtml = `<div style="background: linear-gradient(135deg, #8B0000 0%, #CC0000 50%, #8B0000 100%); border-bottom: 3px solid #FFD700; padding: 20px 16px; text-align: center; margin-bottom: 0;">
        <div style="font-size: 9px; letter-spacing: 3px; color: #FFD700;">🔴 লাইভ ম্যাচ চলছে</div>
        <div style="font-size: clamp(14px, 4vw, 20px); font-weight: bold; color: #FFD700; margin-top: 5px;">${liveMatchFormatted}</div>
        <div style="font-size: 10px; color: #FFD700; margin-bottom: 8px;">${formatDateHeader(liveMatch.date)} · ${liveTimeObj.hour}:${liveTimeObj.minute} ${liveTimeObj.ampm} বিএসটি · 📍 ${liveMatch.venue}</div>
        <div class="live-pulse" style="display: inline-block; background: #ff0000; color: white; font-size: 10px; font-weight: bold; padding: 4px 16px; border-radius: 30px;">⚽ লাইভ</div>
      </div>`;
    }
    
    let nextMatchHtml = "";
    if (nextMatch && !liveMatch) {
      let nextMatchFormatted = nextMatch.match;
      if (nextMatch.stage === "Group Stage" && nextMatch.score1 !== undefined && nextMatch.score2 !== undefined) {
        nextMatchFormatted = formatMatchWithScore(nextMatch.match, nextMatch.score1, nextMatch.score2);
      } else if (nextMatch.match.includes(" vs ") && !nextMatch.match.includes("বনাম") && !nextMatch.match.includes("TBD") && !nextMatch.match.includes("Winner")) {
        nextMatchFormatted = formatMatchWithBn(nextMatch.match);
      }
      const timeObjNext = formatTime12(nextMatch.time);
      nextMatchHtml = `<div style="background: linear-gradient(135deg, #5C1A1B 0%, #8B2A2B 50%, #2D0A0A 100%); border-bottom: 3px solid #FFD700; padding: 20px 16px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.4);">
        <div style="font-size: 9px; letter-spacing: 3px; color: #FFD700;">⚽ পরবর্তী ম্যাচ - বাংলাদেশ মান সময়</div>
        <div style="font-size: clamp(14px, 4vw, 20px); font-weight: bold; color: #FFD700; margin-top: 5px;">${nextMatchFormatted}</div>
        <div style="font-size: 10px; color: #FFD700; margin-bottom: 12px;">${formatDateHeader(nextMatch.date)} · ${timeObjNext.hour}:${timeObjNext.minute} ${timeObjNext.ampm} বিএসটি · 📍 ${nextMatch.venue}</div>
        <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
          <div class="countdown-box"><div class="countdown-number">${pad(cd.d)}</div><div class="countdown-label">দিন</div></div>
          <div class="countdown-box"><div class="countdown-number">${pad(cd.h)}</div><div class="countdown-label">ঘণ্টা</div></div>
          <div class="countdown-box"><div class="countdown-number">${pad(cd.m)}</div><div class="countdown-label">মিনিট</div></div>
          <div class="countdown-box"><div class="countdown-number">${pad(cd.s)}</div><div class="countdown-label">সেকেন্ড</div></div>
        </div>
      </div>`;
    } else if (!liveMatch && !nextMatch) {
      nextMatchHtml = `<div style="background: linear-gradient(135deg, #5C1A1B 0%, #8B2A2B 50%, #2D0A0A 100%); border-bottom: 3px solid #FFD700; padding: 20px; text-align: center; color: #FFD700; font-size: 18px;">🏆 প্রতিযোগিতা সমাপ্ত!</div>`;
    } else if (liveMatch && nextMatch && cd) {
      let nextMatchFormatted = nextMatch.match;
      if (nextMatch.stage === "Group Stage" && nextMatch.score1 !== undefined && nextMatch.score2 !== undefined) {
        nextMatchFormatted = formatMatchWithScore(nextMatch.match, nextMatch.score1, nextMatch.score2);
      } else if (nextMatch.match.includes(" vs ") && !nextMatch.match.includes("বনাম") && !nextMatch.match.includes("TBD") && !nextMatch.match.includes("Winner")) {
        nextMatchFormatted = formatMatchWithBn(nextMatch.match);
      }
      const timeObjNext = formatTime12(nextMatch.time);
      nextMatchHtml = `<div style="background: linear-gradient(135deg, #1a3a5c 0%, #0e2a4a 50%, #1a3a5c 100%); border-top: 2px solid #FFD700; border-bottom: 2px solid #FFD700; padding: 16px 16px; text-align: center;">
        <div style="font-size: 9px; letter-spacing: 2px; color: #FFD700;">⏰ পরবর্তী ম্যাচ</div>
        <div style="font-size: clamp(12px, 3.5vw, 16px); font-weight: bold; color: #FFD700; margin-top: 4px;">${nextMatchFormatted}</div>
        <div style="font-size: 9px; color: #FFD700; margin-bottom: 8px;">${formatDateHeader(nextMatch.date)} · ${timeObjNext.hour}:${timeObjNext.minute} ${timeObjNext.ampm} বিএসটি</div>
        <div style="display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;">
          <div class="countdown-box" style="padding: 4px 8px; min-width: 45px;"><div class="countdown-number" style="font-size: 16px;">${pad(cd.d)}</div><div class="countdown-label">দিন</div></div>
          <div class="countdown-box" style="padding: 4px 8px; min-width: 45px;"><div class="countdown-number" style="font-size: 16px;">${pad(cd.h)}</div><div class="countdown-label">ঘণ্টা</div></div>
          <div class="countdown-box" style="padding: 4px 8px; min-width: 45px;"><div class="countdown-number" style="font-size: 16px;">${pad(cd.m)}</div><div class="countdown-label">মিনিট</div></div>
          <div class="countdown-box" style="padding: 4px 8px; min-width: 45px;"><div class="countdown-number" style="font-size: 16px;">${pad(cd.s)}</div><div class="countdown-label">সেকেন্ড</div></div>
        </div>
      </div>`;
    }
    
    const fullHtml = `<div style="min-height: 100vh;">${liveMatchHtml}${nextMatchHtml}<div style="background: rgba(4,18,38,0.96); padding: 14px 16px; text-align: center; border-bottom: 1px solid rgba(197,160,40,0.15);">
      <div class="filter-buttons-wrapper">
        <button id="toggleGroupsBtn" class="group-tag-btn">📋 ${currentState.showGroups ? "▲ গ্রুপ লুকান" : "▼ সব গ্রুপ দেখুন"}</button>
      </div>
      <div class="live-buttons-wrapper">
        <button class="watch-live-btn" data-url="https://livekhela.movielinkbd.li/">🔴 স্ট্রিম ১</button>
        <button class="watch-live-btn-alt" data-url="https://kickbd.org/">📺 স্ট্রিম ২</button>
        <button class="watch-live-btn-alt" data-url="https://tvprobd.vercel.app/">📡 স্ট্রিম ৩</button>
      </div>
      <div id="groupsPanel" style="margin-top: 8px;">${groupsPanelHtml}</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px;">${stageListEn.map((s, idx) => `<button data-stage="${s}" class="stage-btn ${currentState.selectedStage === s ? 'active' : ''}">${stageListBn[idx]}</button>`).join('')}</div>
    </div>
    <div style="background: rgba(10,30,58,0.6); padding: 6px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
      <span style="font-size: 10px; font-weight: bold; color: #c5a028;">${stageListBn[stageListEn.indexOf(currentState.selectedStage)]}</span>
      <span style="font-size: 10px; color: rgba(255,255,255,0.3);">— ${stageMatches.length} টি ম্যাচ</span>
    </div>
    <div class="fixture-container">${fixturesHtml}</div>
    <div class="footer-text">THIS FIXTURE WEBSITE IS MADE BY SOUAD</div>
    </div>`;
    
    root.innerHTML = fullHtml;
    
    // Event listeners
    document.getElementById("toggleGroupsBtn")?.addEventListener("click", toggleGroups);
    
    document.querySelectorAll("[data-url]").forEach(btn => {
      btn.addEventListener("click", function(e) {
        const url = this.getAttribute("data-url");
        if (url) openLiveStream(url);
      });
    });
    
    document.querySelectorAll("[data-stage]").forEach(btn => btn.addEventListener("click", (e) => { 
      const stage = btn.getAttribute("data-stage"); 
      if(stage) setStage(stage); 
    }));
  }
  
  function init() { 
    // Set initial stage based on current time
    const activeFixtures = removeOldMatches(fixturesRaw, new Date());
    currentState.selectedStage = getActiveStage(activeFixtures, new Date());
    
    renderApp(); 
    intervalId = setInterval(() => { 
      currentState.now = new Date(); 
      // Check if current stage still has matches, if not auto-switch
      const activeFixturesNow = removeOldMatches(fixturesRaw, currentState.now);
      const hasMatchesInSelected = activeFixturesNow.some(f => f.stage === currentState.selectedStage);
      if (!hasMatchesInSelected) {
        const detectedStage = getActiveStage(activeFixturesNow, currentState.now);
        currentState.selectedStage = detectedStage;
      }
      renderApp(); 
    }, 1000); 
  }
  init();
</script>
    
</body>
</html>
