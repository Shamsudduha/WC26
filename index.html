<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>বিশ্বকাপ ২০২৬ - স্পেন চ্যাম্পিয়ন!</title>
  <link href="https://fonts.maateen.me/nitor-bangla/font.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="12.png"> 
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(145deg, #020b18 0%, #041226 60%, #071c38 100%);
      font-family: 'Nitor Bangla', 'Segoe UI', 'Roboto', sans-serif;
      color: #e8d9b0;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #041226; }
    ::-webkit-scrollbar-thumb { background: #c5a028; border-radius: 6px; }
    button { transition: all 0.2s ease; font-family: 'Nitor Bangla', 'Segoe UI', sans-serif; cursor: pointer; }
    button:active { transform: scale(0.96); opacity: 0.8; }
    
    /* Celebration Animation - Optimized for mobile */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: confettiFall linear forwards;
      will-change: transform, opacity;
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
    }
    
    /* Fireworks effect - Optimized */
    .firework {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      border-radius: 50%;
      animation: fireworkBurst 1.5s ease-out forwards;
      will-change: transform, opacity;
    }
    @keyframes fireworkBurst {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(4); opacity: 0; }
    }
    
    /* Sparkle stars - Optimized */
    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 9997;
      font-size: 20px;
      animation: sparkleFloat 3s ease-in-out forwards;
      will-change: transform, opacity;
    }
    @keyframes sparkleFloat {
      0% { transform: translateY(0) scale(0) rotate(0deg); opacity: 1; }
      50% { transform: translateY(-80px) scale(1.3) rotate(180deg); opacity: 1; }
      100% { transform: translateY(-160px) scale(0) rotate(360deg); opacity: 0; }
    }
    
    /* Glowing trophy pulse */
    .trophy-glow {
      animation: trophyGlow 1.5s ease-in-out infinite;
    }
    @keyframes trophyGlow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(255,215,0,0.3)); }
      50% { filter: drop-shadow(0 0 60px rgba(255,215,0,0.9)) drop-shadow(0 0 120px rgba(255,215,0,0.4)); }
    }
    
    .celebration-banner {
      background: linear-gradient(135deg, #5C0000 0%, #8B0000 50%, #5C0000 100%);
      padding: 30px 20px;
      text-align: center;
      border-bottom: 4px solid #FFD700;
      animation: glowPulse 2s ease-in-out infinite;
      position: relative;
      z-index: 100;
      overflow: hidden;
    }
    .celebration-banner::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, transparent 70%);
      animation: rotateBg 20s linear infinite;
    }
    @keyframes rotateBg {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(139,0,0,0.3); }
      50% { box-shadow: 0 0 60px rgba(139,0,0,0.6), 0 0 100px rgba(139,0,0,0.3); }
    }
    .celebration-banner .trophy-icon {
      font-size: 60px;
      display: block;
      animation: bounce 1.5s ease-in-out infinite;
      position: relative;
      z-index: 1;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.1); }

    .celebration-banner .champion-box {

    b { color: #c5a028; font-weight: 500; margin: 0 2px; }

      }
      .last5-cell .result-icon {

      }

      }

    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    /* Next World Cup Section */
    .next-worldcup-section {
      background: linear-gradient(135deg, #043020 0%, #06402B 50%, #043020 100%);

    }
    .next-worldcup-section h2 {

    .next-worldcup-section .hosts {

    .countdown-container {

    .countdown-box {

    /* Reduced motion for mobile */
    @media (max-width: 768px) {
      .celebration-banner .trophy-icon {

<!-- Confetti Container for Celebration -->
<div id="confettiContainer" class="confetti-container"></div>

<script>
  // ================= দেশের নাম বাংলায় =================
  const countryBn = {
    "Mexico": "মেক্সিকো", "South Africa": "দক্ষিণ আফ্রিকা", "Korea Republic": "দক্ষিণ কোরিয়া", "Czechia": "চেকিয়া",
    "Canada": "কানাডা", "Bosnia and Herzegovina": "বসনিয়া", "Qatar": "কাতার", "Switzerland": "সুইজারল্যান্ড",
    "Brazil": "ব্রাজিল", "Morocco": "মরক্কো", "Haiti": "হাইতি", "Scotland": "স্কটল্যান্ড",
    "USA": "মার্কিন যুক্তরাষ্ট্র", "Paraguay": "প্যারাগুয়ে", "Australia": "অস্ট্রেলিয়া", "Türkiye": "তুরস্ক", "Turkey": "তুরস্ক",
    "Germany": "জার্মানি", "Curaçao": "কুরাসাও", "Côte d'Ivoire": "আইভরি কোস্ট", "Ivory Coast": "আইভরি কোস্ট", "Ecuador": "ইকুয়েডর",
    "Netherlands": "নেদারল্যান্ডস", "Japan": "জাপান", "Sweden": "সুইডেন", "Tunisia": "তিউনিসিয়া",
    "Belgium": "বেলজিয়াম", "Egypt": "মিশর", "IR Iran": "ইরান", "Iran": "ইরান", "New Zealand": "নিউজিল্যান্ড",
    "Spain": "স্পেন", "Cape Verde Islands": "কেপ ভার্দে", "Saudi Arabia": "সৌদি আরব", "Uruguay": "উরুগুয়ে",
    "France": "ফ্রান্স", "Senegal": "সেনেগাল", "Iraq": "ইরাক", "Norway": "নরওয়ে",
    "Argentina": "আর্জেন্টিনা", "Algeria": "আলজেরিয়া", "Austria": "অস্ট্রিয়া", "Jordan": "জর্ডান",
    "Portugal": "পর্তুগাল", "Congo DR": "কঙ্গো", "Uzbekistan": "উজবেকিস্তান", "Colombia": "কলম্বিয়া",
    "England": "ইংল্যান্ড", "Croatia": "ক্রোয়েশিয়া", "Ghana": "ঘানা", "Panama": "পানামা",
    "DR Congo": "ডিআর কঙ্গো", "Cabo Verde": "কেপ ভার্দে", "Czech Republic": "চেকিয়া"
  };

  // ================= ফ্লাগ ম্যাপ =================
  const flagMap = {
    "Mexico":"mx", "South Africa":"za", "Korea Republic":"kr", "Czechia":"cz", "Czech Republic":"cz",
    "Canada":"ca", "Bosnia and Herzegovina":"ba", "Qatar":"qa", "Switzerland":"ch",
    "Brazil":"br", "Morocco":"ma", "Haiti":"ht", "Scotland":"gb-sct",
    "USA":"us", "Paraguay":"py", "Australia":"au", "Türkiye":"tr", "Turkey":"tr",
    "Germany":"de", "Curaçao":"cw", "Côte d'Ivoire":"ci", "Ivory Coast":"ci", "Ecuador":"ec",
    "Netherlands":"nl", "Japan":"jp", "Sweden":"se", "Tunisia":"tn",
    "Belgium":"be", "Egypt":"eg", "IR Iran":"ir", "Iran":"ir", "New Zealand":"nz",
    "Spain":"es", "Cape Verde Islands":"cv", "Saudi Arabia":"sa", "Uruguay":"uy",
    "France":"fr", "Senegal":"sn", "Iraq":"iq", "Norway":"no",
    "Argentina":"ar", "Algeria":"dz", "Austria":"at", "Jordan":"jo",
    "Portugal":"pt", "Congo DR":"cd", "Uzbekistan":"uz", "Colombia":"co",
    "England":"gb-eng", "Croatia":"hr", "Ghana":"gh", "Panama":"pa",
    "DR Congo":"cd", "Cabo Verde":"cv"
  };

  function getFlag(country){
    const code = flagMap[country];
    if(!code) return "🏳️";
    return `<img src="https://flagcdn.com/24x18/${code}.png" class="flag-img" alt="${country} flag" loading="lazy">`;
  }

  function getFlagSmall(country){
    const code = flagMap[country];
    if(!code) return "🏳️";
    return `<img src="https://flagcdn.com/24x18/${code}.png" alt="${country} flag" loading="lazy">`;
  }

  function formatMatchWithBn(matchStr){
    if(!matchStr) return "";
    if(matchStr.includes("Match") || matchStr.includes("W") || matchStr.includes("QF") || matchStr.includes("SF") || matchStr.includes("RU") || matchStr.includes("বনাম") || matchStr.includes("TBD") || matchStr.includes("Winner")) return matchStr;
    if(matchStr.includes(" vs ")){
      const parts = matchStr.split(" vs ");
      if(parts.length === 2){
        const left = parts[0].trim();
        const right = parts[1].trim();
        const leftBn = countryBn[left] || left;
        const rightBn = countryBn[right] || right;
        return `<span class="team-name">${getFlag(left)} ${leftBn}</span> <b>বনাম</b> <span class="team-name">${getFlag(right)} ${rightBn}</span>`;
      }
    }
    return matchStr;
  }

  function formatMatchWithScore(matchStr, score1, score2, penalty) {
    if(!matchStr) return "";
    if(matchStr.includes(" vs ")){
      const parts = matchStr.split(" vs ");
      if(parts.length === 2){
        const left = parts[0].trim();

  // Parse match time correctly for Bangladesh time (UTC+6)
  function parseMatchDateTime(dateStr, timeStr) {
    const [h, m] = timeStr.split(":").map(Number);
    const [y, mo, d] = dateStr.split("-").map(Number);
    return new Date(Date.UTC(y, mo-1, d, h-6, m));
  }

  function formatCountdown(ms) {
    if (ms <= 0) return { d:0, h:0, m:0, s:0 };
    const totalSec = Math.floor(ms / 1000);
    return { d: Math.floor(totalSec / 86400), h: Math.floor((totalSec % 86400) / 3600), m: Math.floor((totalSec % 3600) / 60), s: totalSec % 60 };
  }

  function pad(n) { return String(n).padStart(2, "0"); }
  
  function formatTime12(timeStr) {
    const [h, m] = timeStr.split(":").map(Number);
    const hour12 = h % 12 || 12;
    const ampm = h >= 12 ? "PM" : "AM";
    return { hour: hour12, minute: pad(m), ampm: ampm };
  }
  
  function formatDateHeader(dateStr) {
    const d = new Date(dateStr + "T12:00:00");
    return d.toLocaleDateString("bn-BD", { weekday:"short", month:"short", day:"numeric" }).toUpperCase();
  }

  function isMatchLive(matchDateTime) {
    const now = new Date();
    const matchEndTime = new Date(matchDateTime.getTime() + 105 * 60000);
    return (matchDateTime <= now && now <= matchEndTime);
  }

  // Keep all matches permanently
  function removeOldMatches(fixtures, currentTime) {
    return fixtures;
  }

  let currentState = { 
    now: new Date(), 
    selectedStage: "Final", 
    showGroups: false,
    showPoints: false
  };
  let intervalId = null;

  function setStage(stage) { 
    currentState.selectedStage = stage; 
    renderApp(); 
  }
  
  function toggleGroups() { 
    currentState.showGroups = !currentState.showGroups; 
    if (currentState.showGroups) currentState.showPoints = false;
    renderApp(); 
  }
  
  function togglePoints() {
    currentState.showPoints = !currentState.showPoints;
    if (currentState.showPoints) currentState.showGroups = false;
    renderApp();
  }
  
  function getNextMatch(fixturesWithDT) { 
    return fixturesWithDT.filter(f => f.dt > currentState.now).sort((a,b) => a.dt - b.dt)[0] || null; 
  }
  
  function getLiveMatch(fixturesWithDT) {
    return fixturesWithDT.filter(f => isMatchLive(f.dt)).sort((a,b) => a.dt - b.dt)[0] || null;
  }

  // ================= Confetti Celebration - Optimized for Mobile =================
  function launchConfetti() {
    const container = document.getElementById('confettiContainer');
    if (!container) return;
    
    // Reduce number of confetti on mobile for better performance
    const isMobile = window.innerWidth <= 768;
    const count = isMobile ? 120 : 250;
    const colors = ['#FFD700', '#FF6B35', '#44BBA4', '#E94F37', '#3BCEAC', '#FF006E', '#8338EC', '#FB5607', '#FFD700', '#FF0000', '#00FF00', '#00CCFF'];
    const shapes = ['■', '●', '▲', '★', '♦', '♥'];
    
    for (let i = 0; i < count; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      const color = colors[Math.floor(Math.random() * colors.length)];
      const size = isMobile ? Math.random() * 6 + 3 : Math.random() * 10 + 4;
      const left = Math.random() * 100;
      const duration = Math.random() * 3 + 2;
      const delay = Math.random() * 3;
      const shape = shapes[Math.floor(Math.random() * shapes.length)];
      
      confetti.style.cssText = `
        left: ${left}%;
        width: ${size}px;
        height: ${size}px;
        background: ${color};
        color: ${color};
        font-size: ${size}px;
        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
        animation-duration: ${duration}s;
        animation-delay: ${delay}s;
        display: flex;
        align-items: center;
        justify-content: center;
      `;
      confetti.textContent = shape;
      container.appendChild(confetti);
    }
    
    setTimeout(() => {
      container.innerHTML = '';
    }, 6000);
  }

  function launchFirework() {
    const container = document.getElementById('confettiContainer');
    if (!container) return;
    
    const isMobile = window.innerWidth <= 768;
    const count = isMobile ? 15 : 30;
    const colors = ['#FFD700', '#FF0000', '#00FF00', '#FF6B35', '#44BBA4', '#FF006E', '#8338EC', '#FB5607'];
    
    for (let burst = 0; burst < count; burst++) {
      setTimeout(() => {
        const firework = document.createElement('div');
        firework.className = 'firework';
        const size = isMobile ? Math.random() * 4 + 2 : Math.random() * 8 + 4;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const x = Math.random() * 100;
        const y = Math.random() * 60 + 10;
        
        firework.style.cssText = `
          left: ${x}%;
          top: ${y}%;
          width: ${size}px;
          height: ${size}px;
          background: ${color};
          box-shadow: 0 0 ${size*3}px ${color}, 0 0 ${size*6}px ${color};
          animation-duration: ${Math.random() * 1 + 1}s;
        `;
        container.appendChild(firework);
        
        setTimeout(() => {
          firework.remove();
        }, 2000);
      }, burst * (isMobile ? 150 : 100));
    }

                  <td>${t.gf}</td>
                  <td>${t.ga}</td>
                  <td class="${gdClass}">${t.gd > 0 ? '+' + t.gd : t.gd}</td>
                  <td class="pts-cell">${t.pts}</td>
                  <td><div class="last5-cell">${last5Icons}</div></td>
                </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
        `;
      }).join('')}</div>`;
    }
    
    let fixturesHtml = "";
    if (Object.keys(byDate).length === 0) {
      fixturesHtml = `<div style="text-align:center; color:#2a4a6a; padding:40px 0;">🚫 কোন ম্যাচ পাওয়া যায়নি</div>`;
    } else {
      fixturesHtml = Object.entries(byDate).map(([date, matches]) => {
        const dateHeader = formatDateHeader(date);
        const matchesHtml = matches.map(m => {
          const mDT = parseMatchDateTime(m.date, m.time);
          const isPast = mDT < currentState.now && !isMatchLive(mDT);
          const isThisLive = isMatchLive(mDT);
          const isNextFlag = nextMatch && nextMatch.match === m.match && nextMatch.date === m.date && nextMatch.time === m.time;
          
          let matchWithFlags = m.match;
          if (m.score1 !== undefined && m.score2 !== undefined) {
            if (m.match && m.match.includes(" vs ")) {
              matchWithFlags = formatMatchWithScore(m.match, m.score1, m.score2, m.penalty);
            } else {
              matchWithFlags = m.match;
            }
          } else if (m.match && m.match.includes(" vs ") && !m.match.includes("বনাম") && !m.match.includes("TBD") && !m.match.includes("Winner")) {
            matchWithFlags = formatMatchWithBn(m.match);
          } else if (m.match && (m.match.includes("বনাম") || m.match.includes("W") || m.match.includes("RU") || m.match.includes("TBD") || m.match.includes("Winner"))) {
            matchWithFlags = m.match;
          } else if (m.match && m.match.includes(" vs ")) {
            matchWithFlags = formatMatchWithBn(m.match);
          }
          
          const timeObj = formatTime12(m.time);
          
          let statusBadge = "";
          if (isThisLive) {
            statusBadge = `<span style="background: #ff0000; color: white; font-size: 8px; font-weight: bold; padding: 2px 8px; border-radius: 20px; margin-left: 8px;" class="live-pulse">🔴 লাইভ</span>`;
          }
          
          // Champion badge removed from match result - only showing in banner
          
          return `<div style="background: ${isThisLive ? 'rgba(255,0,0,0.15)' : (isNextFlag ? 'rgba(197,160,40,0.12)' : isPast ? 'rgba(255,255,255,0.015)' : 'rgba(255,255,255,0.04)')}; border-left: 3px solid ${isThisLive ? '#ff0000' : (isNextFlag ? '#c5a028' : '#2a4a6a')}; border-radius: 12px; padding: 12px; margin-bottom: 10px; position: relative; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            ${isNextFlag && !isThisLive ? `<div style="position: absolute; top: -9px; right: 10px; background: #c5a028; color: #041226; font-size: 8px; font-weight: bold; padding: 2px 12px; border-radius: 40px;">পরবর্তী</div>` : ''}
            <div class="time-badge"><div><span class="time-hour">${timeObj.hour}:${timeObj.minute}</span><span class="time-ampm">${timeObj.ampm}</span></div><div class="time-label">বিএসটি</div></div>
            <div style="flex: 1; min-width: 150px;"><div style="font-size: 14px; font-weight: 600; color: ${isPast ? '#809cb0' : '#fdf6e3'}; line-height: 1.4;">${matchWithFlags} ${statusBadge}</div><div style="font-size: 10px; color: #6f8faa; margin-top: 5px;">📍 ${m.venue}</div></div>
          </div>`;
        }).join('');
        return `<div style="margin-bottom: 28px;"><div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;"><div style="background: linear-gradient(135deg, #c5a028, #e6cf6e); color: #041226; font-weight: bold; font-size: 10px; padding: 4px 16px; border-radius: 40px;">${dateHeader}</div><div style="flex: 1; height: 1px; background: radial-gradient(circle, rgba(197,160,40,0.4), transparent);"></div></div>${matchesHtml}</div>`;
      }).join('');
    }
    
    // Calculate 2030 World Cup countdown
    const worldCup2030 = new Date(2030, 5, 8, 0, 0, 0);
    const now = new Date();
    const diffMs = worldCup2030 - now;
    const cd2030 = formatCountdown(diffMs);
    
    const celebrationHtml = `
      <div class="celebration-banner">
        <span class="trophy-icon trophy-glow">🏆</span>
        <div class="champion-box">
          <div class="champion-title">🏅 বিশ্বকাপ ২০২৬-এর আনুষ্ঠানিক চ্যাম্পিয়ন</div>
          <div class="champion-team">🇪🇸 স্পেন</div>
        </div>
        <p class="footer-text-celeb">একটি স্মরণীয় বিশ্বকাপের সফল সমাপ্তি। ফুটবলের এই মহোৎসবে আবারও দেখা হবে বিশ্বকাপ ২০৩০-এ।</p>
      </div>
    `;
    
    const nextWorldCupHtml = `
      <div class="next-worldcup-section">
        <h2>বিশ্বকাপ ২০৩০-এর অপেক্ষায়</h2>
        <div class="hosts">
          <span>আয়োজক দেশসমূহ</span>
          <span class="host-label">🇪🇸 স্পেন • 🇵🇹 পর্তুগাল • 🇲🇦 মরক্কো</span>
        </div>
        <div class="countdown-container">
          <div class="countdown-box">
            <div class="countdown-number">${pad(cd2030.d)}</div>
            <div class="countdown-label">দিন</div>
          </div>
          <div class="countdown-box">
            <div class="countdown-number">${pad(cd2030.h)}</div>
            <div class="countdown-label">ঘণ্টা</div>
          </div>
          <div class="countdown-box">
            <div class="countdown-number">${pad(cd2030.m)}</div>
            <div class="countdown-label">মিনিট</div>
          </div>
          <div class="countdown-box">
            <div class="countdown-number">${pad(cd2030.s)}</div>
            <div class="countdown-label">সেকেন্ড</div>
          </div>
        </div>
        <p class="date-info">বিশ্বকাপ ২০৩০ অনুষ্ঠিত হবে: ৮ জুন ২০৩০ – ২১ জুলাই ২০৩০</p>
      </div>
    `;
    
    // Get the index of current stage for display
    const currentStageIndex = stageListEn.indexOf(currentState.selectedStage);
    const currentStageName = stageListBn[currentStageIndex] || currentState.selectedStage;
    
    const fullHtml = `<div style="min-height: 100vh;">
      ${celebrationHtml}
      ${nextWorldCupHtml}
      <div style="background: rgba(4,18,38,0.96); padding: 14px 16px; text-align: center; border-bottom: 1px solid rgba(197,160,40,0.15);">
        <div class="filter-buttons-wrapper">
          <button id="toggleGroupsBtn" class="group-tag-btn ${currentState.showGroups ? 'active' : ''}">📋 ${currentState.showGroups ? "▲ গ্রুপ লুকান" : "▼ সব গ্রুপ দেখুন"}</button>
          <button id="togglePointsBtn" class="group-tag-btn ${currentState.showPoints ? 'active' : ''}">📊 ${currentState.showPoints ? "▲ পয়েন্ট টেবিল লুকান" : "পয়েন্ট টেবিল"}</button>
        </div>
        <div id="groupsPanel" style="margin-top: 8px;">${groupsPanelHtml}</div>
        <div id="pointsPanel" style="margin-top: 8px;">${pointsPanelHtml}</div>
        <div class="stage-selector">
          ${stageListEn.map((s, idx) => `<button data-stage="${s}" class="stage-btn ${currentState.selectedStage === s ? 'active' : ''}">${stageListBn[idx]}</button>`).join('')}
        </div>
      </div>
      <div style="background: rgba(10,30,58,0.6); padding: 6px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <span style="font-size: 10px; font-weight: bold; color: #c5a028;">${currentStageName}</span>
        <span style="font-size: 10px; color: rgba(255,255,255,0.3);">— ${stageMatches.length} টি ম্যাচ</span>
      </div>
      <div class="fixture-container">${fixturesHtml}</div>
      <div class="footer-text">THIS FIXTURE WEBSITE IS MADE BY SOUAD</div>
    </div>`;
    
    root.innerHTML = fullHtml;
    
    // Event listeners
    document.getElementById("toggleGroupsBtn")?.addEventListener("click", toggleGroups);
    document.getElementById("togglePointsBtn")?.addEventListener("click", togglePoints);
    
    document.querySelectorAll("[data-stage]").forEach(btn => {
      btn.addEventListener("click", function(e) {
        const stage = this.getAttribute("data-stage");
        if (stage) {
          currentState.selectedStage = stage;
          renderApp();
        }
      });
    });
  }
  
  function init() { 
    currentState.selectedStage = "Final";
    
    renderApp(); 
    
    // Staggered celebration launches with delays for smoother performance
    setTimeout(() => {
      launchConfetti();
      launchFirework();
      launchSparkles();
    }, 400);
    
    setTimeout(() => {
      launchConfetti();
      launchFirework();
    }, 2200);
    
    setTimeout(() => {
      launchConfetti();
      launchSparkles();
      launchFirework();
    }, 4200);
    
    setTimeout(() => {
      launchConfetti();
      launchFirework();
    }, 6200);
    
    intervalId = setInterval(() => { 
      currentState.now = new Date(); 
      renderApp(); 
    }, 1000); 
  }
  
  // Handle visibility change to pause/resume animations for better performance
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      // Page hidden - reduce animations
    } else {
      // Page visible - resume
    }
  });
  
  init();
</script>
    
</body>
</html>
